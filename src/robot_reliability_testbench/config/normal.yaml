/testbench/panda_simulator:
  ros__parameters:
    publication_rate: 50.0
    initial_joint_positions: [0.0, 0.0, 0.0, -1.57079, 0.0, 1.57079, -0.7853]
/testbench/task_server:
  ros__parameters:
    use_sim_time: true
    target_tolerance: 0.005
    task_timeout: 5.0
    infrastructure_timeout: 3.0
/testbench/health_monitor:
  ros__parameters:
    freshness_seconds: 0.15
    progress_window_seconds: 0.20
    movement_threshold_metres: 0.001
    startup_grace_seconds: 0.30
