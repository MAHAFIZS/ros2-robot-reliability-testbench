name: Jazzy container regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build isolated image and packages
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          python3 scripts/build_image.py 2>&1 | tee artifacts/docker-build.log
      - name: Regression, short endurance and negative acceptance check
        shell: bash
        run: |
          set -o pipefail
          docker run --name testbench-ci --network none robot-reliability:jazzy \
            python /workspace/scripts/container_checks.py --output /workspace/reports/ci \
            2>&1 | tee artifacts/container.log
      - name: Collect reports and clean up
        if: always()
        shell: bash
        run: |
          docker cp testbench-ci:/workspace/reports artifacts/ || true
          docker cp testbench-ci:/opt/testbench artifacts/dependencies || true
          docker logs testbench-ci > artifacts/docker.log 2>&1 || true
          docker rm -f testbench-ci || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: jazzy-reports-and-logs
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
